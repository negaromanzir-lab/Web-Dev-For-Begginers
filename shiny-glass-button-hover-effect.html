<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiny Glass Button Hover Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0c0114;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 70px;
            width: 200px;
            padding: 5px;
            color: #ddd;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0px 0px 20px 5px rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 5px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        button:hover {
            transform: scale(1.1);
        }

        button::after {
            content: "";
            position: absolute;
            height: 100%;
            width: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(45deg,
                    transparent 50%, rgba(255, 255, 255, 0.03) 58%, rgba(255, 255, 255, 0.16) 67%,
                    transparent 68%);
            background-size: 200% 100%;
            background-position: 165% 0;
            transition: background-position 1s ease;
        }

        button:hover:after {
            background-position: -20% 0;
        }
    </style>
</head>

<body>
    <button>Hover Me!</button>

</body>

</html>
